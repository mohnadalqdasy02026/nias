name: nias-academy

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-nias}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-nias}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nias}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["node", "server/src/scripts/migrate.js", "up"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-nias}:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/${DB_NAME:-nias}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - db-net

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-nias}:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/${DB_NAME:-nias}
      PORT: 3000
      UPLOAD_DIR: /data/uploads
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    networks:
      - app-net
      - db-net

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
      - uploads:/data/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - app-net

volumes:
  pgdata:
  uploads:

networks:
  app-net:
  db-net:
    internal: true