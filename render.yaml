services:
  - type: web
    name: nias-academy
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace web
    startCommand: node server/src/scripts/migrate.js up && node server/src/scripts/seed-demo-passwords.js && node server/src/scripts/seed-academic-content.js && node server/src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        # Supabase (ap-southeast-1) replaces the expiring Render free Postgres.
        # The transaction pooler is used because the service runs outside Supabase.
        value: postgresql://postgres.ojimbwibjrhddsnxmpls:7htzy3y228%23A@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=no-verify
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: uploads
      # Demo seed scripts (passwords/academic content) run ONLY when SEED_DEMO is true.
      - key: SEED_DEMO
        value: "false"
      - key: PUBLIC_BASE_URL
        value: https://nias-academy.onrender.com
      # Google Gemini (AI smart assistant)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

databases:
  - name: nias-postgres
    plan: free