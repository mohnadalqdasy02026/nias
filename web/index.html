    <title>المعهد الوطني للعلوم الإدارية | NIAS Academy</title>
    <script>
      (function () {
        var isLocked = true;
        function block(e) {
          if (isLocked) e.preventDefault();
        }
        document.addEventListener('gesturestart', block);
        document.addEventListener('gesturechange', block);
        document.addEventListener('gestureend', block);
        document.addEventListener(
          'touchmove',
          function (e) {
            if (isLocked && e.touches && e.touches.length > 1) e.preventDefault();
          },
          { passive: false }
        );
        document.addEventListener(
          'wheel',
          function (e) {
            if (isLocked && (e.ctrlKey || e.metaKey)) e.preventDefault();
          },
          { passive: false }
        );
        function onKey(e) {
          if (isLocked && (e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '0')) {
            e.preventDefault();
          }
        }
        document.addEventListener('keydown', onKey);
        document.addEventListener('dblclick', block);
      })();
    </script>

  <body>
    <div id="root"></div>
